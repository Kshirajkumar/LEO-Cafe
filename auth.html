<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · LEO Hotel</title><link rel="stylesheet" href="hotel.css"></head><body>
<header class="hotel-wrap hotel-nav"><a class="hotel-brand" href="index.html"><span class="hotel-mark">L</span> LEO HOTEL</a><nav class="hotel-links"><a href="menu.html">Back to menu</a><a href="index.html">Home</a></nav></header>
<main class="hotel-wrap auth-layout"><section><p class="eyebrow">A smoother stay</p><h1>Keep your<br><em>table with you.</em></h1><p class="auth-intro">Sign in once to keep your order details close, check out faster, and call the LEO team from your table.</p><div class="auth-note"><span>✦</span><p>Your password is handled by Supabase Auth. LEO never stores it in the browser.</p></div></section><section class="auth-card"><div class="auth-tabs"><button class="auth-tab active" data-mode="login">Sign in</button><button class="auth-tab" data-mode="signup">Create account</button></div><form id="authForm"><label class="auth-field signup-only" hidden>What should we call you?<input id="authName" autocomplete="name" placeholder="Your name"></label><label class="auth-field">Email address<input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label><label class="auth-field">Password<input id="authPassword" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters"></label><button class="button orange auth-submit" type="submit" id="authSubmit">Sign in <span>→</span></button><p class="auth-message" id="authMessage" role="status"></p></form><div class="auth-foot"><a href="menu.html">Continue browsing as a guest</a></div></section></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script><script src="auth.js"></script></body></html>
