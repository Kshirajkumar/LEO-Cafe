<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu · LEO Hotel</title><link rel="stylesheet" href="hotel.css"></head><body>
<header class="hotel-wrap hotel-nav"><a class="hotel-brand" href="index.html"><span class="hotel-mark">L</span> LEO HOTEL</a><nav class="hotel-links"><a href="index.html">Home</a><a href="menu.html">Menu</a><a href="auth.html?next=menu.html" id="accountLink">Sign in</a><a href="admin.html">Admin</a><a href="waiter.html">Waiter</a></nav><button class="button light" id="openCart">Bag <span id="bagCount">0</span></button></header>
<main class="hotel-wrap"><section class="page-hero"><div><p class="eyebrow">LEO Hotel · all-day dining</p><h1>A table worth<br><em>staying for.</em></h1></div><div><span class="table-badge" id="tableBadge">Walk-in menu</span><p>Order from your table, choose pay now or pay after your meal, and call your waiter whenever you need one.</p></div></section><div class="menu-toolbar" id="menuFilters"></div><section class="menu-grid-detailed" id="menuGrid"></section></main>
<aside class="drawer" id="cartDrawer"><div class="drawer-head"><h2>Your bag <span id="bagCountDrawer">(0)</span></h2><button class="drawer-close" id="closeCart">×</button></div><div id="cartLines"></div><form class="checkout-box" id="checkoutForm"><div class="drawer-total"><span>Subtotal</span><strong id="cartTotal">₹0</strong></div><label>Name for this order<input required id="guestName" placeholder="What should we call you?"></label><label>Phone<input required id="guestPhone" type="tel" pattern="[0-9 +()-]{10,}" placeholder="10-digit number"></label><label>Notes<textarea id="guestNotes" rows="2" placeholder="Less spicy, extra napkins..."></textarea></label><div class="payment-choice"><label><input type="radio" name="payment" value="pay_later" checked> Pay after meal</label><label><input type="radio" name="payment" value="online_demo"> Pay now (demo)</label></div><button class="button orange" type="submit">Place order <span>→</span></button><button class="button light" type="button" id="callWaiter">Call waiter <span>✦</span></button><small id="checkoutNote">Sign in is required before placing an order.</small></form></aside><div class="overlay" id="overlay"></div><div class="toast" id="toast"></div>
<script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script><script src="menu-data.js"></script><script src="auth.js"></script><script src="hotel.js"></script></body></html>
